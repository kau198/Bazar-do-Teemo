plugins { id 'com.android.application' }
android {
 namespace 'br.com.baazardoteemo'
 compileSdk 35
 defaultConfig {
   applicationId 'br.com.baazardoteemo'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.1.0'
   testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildTypes {
   debug { applicationIdSuffix '.preview'; manifestPlaceholders = [cleartext: 'true'] }
   release { manifestPlaceholders = [cleartext: 'false']; minifyEnabled false }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
 androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
